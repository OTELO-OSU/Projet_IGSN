# Ports are shifted off the dev ports so this can run alongside `make dev`
# KC_HTTP_PORT 18080 inside too, so issued URLs match browser and broker

x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost:$$PORT/"]
  interval: 2s
  timeout: 3s
  retries: 60

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: igsn
      POSTGRES_PASSWORD: igsn
      POSTGRES_DB: igsn
    healthcheck:
      # -h localhost forces TCP: the postgis init serves a socket-only server
      test: ["CMD-SHELL", "pg_isready -U igsn -d igsn -h localhost"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: ./packages/api/Dockerfile
      target: prod
    # node, not `pnpm run`: /app is root-owned and `pnpm run` writes there
    command: ["node", "scripts/migrate.ts"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: igsn
      DATABASE_USER: igsn
      DATABASE_PASSWORD: igsn
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: ./packages/api/Dockerfile
      target: prod
    environment:
      PORT: "3002"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: igsn
      DATABASE_USER: igsn
      DATABASE_PASSWORD: igsn
      OIDC_ISSUER: http://localhost:18080/realms/igsn
      OIDC_JWKS_URI: http://keycloak:18080/realms/igsn/protocol/openid-connect/certs
      OIDC_USERINFO_URI: http://keycloak:18080/realms/igsn/protocol/openid-connect/userinfo
      OIDC_CLIENT_ID: igsn-admin
      # Pinned so the refusal assertions do not depend on the host shell.
      OIDC_ALLOWED_IDENTITY_PROVIDERS: "satosa,orcid"
      CORS_ORIGINS: http://localhost:4001,http://localhost:4000
      ADMIN_URL: http://localhost:4001
      # Off: all traffic shares one client address, so a budget flakes runs
      RATE_LIMIT_ENABLED: "false"
      # Named volume: a bind mount leaks blobs across runs and gives EACCES
      ATTACHMENTS_DIR: /data/attachments
      # Pinned so the search assertions do not depend on the host shell.
      SAMPLE_SEARCH_FUZZY_THRESHOLD: "0.8"
      UPLOAD_LIMIT: "5"
      SAMPLE_EDIT_LOCK_TTL_MINUTES: "15"
      # No SMTP_USER/SMTP_PASSWORD, unlike preprod: maildev takes anonymous SMTP.
      SMTP_HOST: maildev
      SMTP_PORT: "1025"
      SMTP_FROM: postmaster@igsn.localhost
    volumes:
      - attachments:/data/attachments
    healthcheck: *healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "4002:3002"

  admin:
    build:
      context: .
      dockerfile: ./packages/admin/Dockerfile
      target: prod
      args:
        VITE_OIDC_AUTHORITY: http://localhost:18080/realms/igsn
        VITE_OIDC_CLIENT_ID: igsn-admin
        VITE_API_URL: http://localhost:4002
        VITE_SAMPLE_LOCK_POLL_SECONDS: "30"
    # Caddy binds $PORT (Caddyfile), so listen on 3001 to match the mapping.
    environment:
      PORT: "3001"
    healthcheck: *healthcheck
    ports:
      - "4001:3001"

  frontend:
    build:
      context: .
      dockerfile: ./packages/frontend/Dockerfile
      target: prod
      args:
        VITE_API_URL: http://localhost:4002
    # Nitro binds $PORT; SSR reaches the api in-network, so no CORS
    environment:
      PORT: "3000"
      API_URL: http://api:3002
    healthcheck: *healthcheck
    ports:
      - "4000:3000"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "18080"
      # Pin the issuer: start-dev derives it per request and breaks backchannel
      KC_HOSTNAME: http://localhost:18080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Port-shifted URLs the realm import substitutes (see keycloak/*.json).
      ADMIN_REDIRECT_URI: http://localhost:4001/*
      ADMIN_WEB_ORIGIN: http://localhost:4001
      SHIBBOLETH_SSO_URL: http://localhost:18081/simplesaml/saml2/idp/SSOService.php
      SHIBBOLETH_SLO_URL: http://localhost:18081/simplesaml/saml2/idp/SingleLogoutService.php
      ORCID_LOGOUT_URL: http://localhost:18080/realms/mock-orcid/protocol/openid-connect/logout
      ORCID_BROKER_REDIRECT_URI: http://localhost:18080/realms/igsn/broker/orcid/endpoint
      ORCID_AUTHORIZATION_URL: http://localhost:18080/realms/mock-orcid/protocol/openid-connect/auth
      ORCID_TOKEN_URL: http://localhost:18080/realms/mock-orcid/protocol/openid-connect/token
      ORCID_USERINFO_URL: http://localhost:18080/realms/mock-orcid/protocol/openid-connect/userinfo
      ORCID_ISSUER: http://localhost:18080/realms/mock-orcid
      ORCID_JWKS_URL: http://localhost:18080/realms/mock-orcid/protocol/openid-connect/certs
    # No curl in the image; the realm endpoint proves --import-realm finished
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/18080; printf 'GET /realms/igsn/.well-known/openid-configuration HTTP/1.0\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q ' 200 '",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
    ports:
      - "18080:18080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  saml-idp:
    image: kenchan0130/simplesamlphp
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8080/simplesaml/saml2/idp/metadata.php",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
    ports:
      - "18081:8080"
    environment:
      SIMPLESAMLPHP_SP_ENTITY_ID: http://localhost:18080/realms/igsn
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: http://localhost:18080/realms/igsn/broker/satosa/endpoint
      SIMPLESAMLPHP_SP_SINGLE_LOGOUT_SERVICE: http://localhost:18080/realms/igsn/broker/satosa/endpoint
      SIMPLESAMLPHP_IDP_BASE_URL: http://localhost:18081/simplesaml/
    volumes:
      - ./saml-idp/authsources.php:/var/www/simplesamlphp/config/authsources.php:ro

  maildev:
    image: maildev/maildev:2.2.1
    ports:
      - "11080:1080"

volumes:
  pgdata:
  attachments:
