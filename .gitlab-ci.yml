workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "preprod"
      variables:
        DEPLOY_ENV: preproduction
        IMAGE_TAG: preprod-$CI_COMMIT_SHORT_SHA
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      variables:
        DEPLOY_ENV: production
        IMAGE_TAG: $CI_COMMIT_TAG

variables:
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE

stages:
  - build
  - deploy

build:
  stage: build
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  environment:
    name: $DEPLOY_ENV
    action: prepare
  script:
    - ': "${DOMAIN:?set DOMAIN as a $DEPLOY_ENV environment variable}"'
    - ': "${OIDC_ISSUER:?set OIDC_ISSUER as a $DEPLOY_ENV environment variable}"'
    - ': "${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID as a $DEPLOY_ENV environment variable}"'
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -f packages/api/Dockerfile --target prod -t "$IMAGE_PREFIX/api:$IMAGE_TAG" .
    - |
      docker build -f packages/admin/Dockerfile --target prod -t "$IMAGE_PREFIX/admin:$IMAGE_TAG" \
        --build-arg "VITE_API_URL=https://igsn.$DOMAIN/api" \
        --build-arg "VITE_FRONTEND_URL=https://igsn.$DOMAIN" \
        --build-arg "VITE_OIDC_AUTHORITY=$OIDC_ISSUER" \
        --build-arg "VITE_OIDC_CLIENT_ID=$OIDC_CLIENT_ID" \
        ${UPLOAD_LIMIT:+--build-arg VITE_UPLOAD_LIMIT=$UPLOAD_LIMIT} \
        ${SAMPLE_LOCK_POLL_SECONDS:+--build-arg VITE_SAMPLE_LOCK_POLL_SECONDS=$SAMPLE_LOCK_POLL_SECONDS} \
        .
    - |
      docker build -f packages/frontend/Dockerfile --target prod -t "$IMAGE_PREFIX/frontend:$IMAGE_TAG" \
        --build-arg "VITE_API_URL=https://igsn.$DOMAIN/api" \
        --build-arg "VITE_ADMIN_URL=https://igsn.$DOMAIN/admin" \
        --build-arg "VITE_FRONTEND_URL=https://igsn.$DOMAIN" \
        --build-arg "VITE_OIDC_AUTHORITY=$OIDC_ISSUER" \
        --build-arg "VITE_OIDC_CLIENT_ID=$OIDC_CLIENT_ID" \
        .
    - docker build -t "$IMAGE_PREFIX/caddy:$IMAGE_TAG" infra/stack
    - for image in api admin frontend caddy; do docker push "$IMAGE_PREFIX/$image:$IMAGE_TAG"; done

deploy:
  stage: deploy
  image: node:24
  needs: [build]
  environment:
    name: $DEPLOY_ENV
  resource_group: $DEPLOY_ENV
  allow_failure:
    exit_codes: 3
  variables:
    GIT_FETCH_EXTRA_FLAGS: --prune --quiet --tags
  script:
    - infra/scripts/deploy-portainer.sh
