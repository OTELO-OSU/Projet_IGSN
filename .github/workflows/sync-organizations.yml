name: "Sync organizations"

# Repo one-time setup:
# - Settings -> Actions -> General -> "Allow GitHub Actions to create and
#   approve pull requests" must be enabled, or `gh pr create` below 403s.
on:
  schedule:
    - cron: "0 3 1 1 *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync organizations from ROR
        env:
          ROR_CLIENT_ID: ${{ secrets.ROR_CLIENT_ID }}
        run: node packages/domain/scripts/sync-organizations.ts

      - name: Format the generated file
        run: pnpm fmt:apply packages/domain/src/institutional-group/organization.ts

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          path=packages/domain/src/institutional-group/organization.ts
          if git diff --quiet -- "$path"; then
            echo "ROR agrees with the stored list, nothing to propose."
            exit 0
          fi
          date=$(date -u +%F)
          branch="chore/sync-organizations-$date"
          title="chore(domain): sync organizations from ROR ($date)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "$title" -- "$path"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" \
            --body "Refreshed from the ROR API. The diff is the whole proposal: every changed name or acronym is a row below. A row ROR could not be reached for is left untouched and named in the run log."

      # A PR opened with GITHUB_TOKEN does not trigger check.yml, so the sync
      # runs its own check.
      - name: Run the domain tests
        run: pnpm test --project @projet-igsn/domain
