name: "Sync institutions"

# Repo one-time setup:
# - Settings -> Actions -> General -> "Allow GitHub Actions to create and
#   approve pull requests" must be enabled, or `gh pr create` below 403s.
on:
  schedule:
    # GitHub requires a literal cron, so it cannot read the interval variable.
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  due:
    runs-on: ubuntu-latest
    permissions: {}

    outputs:
      due: ${{ steps.interval.outputs.due }}

    steps:
      - name: Check the sync interval
        id: interval
        env:
          EVENT_NAME: ${{ github.event_name }}
          INTERVAL: ${{ vars.ORGANIZATION_SYNC_INTERVAL_MONTHS || 12 }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Bash evaluates a variable's value as an expression inside $(( )), so
          # anything but a positive integer is rejected before the arithmetic.
          case "$INTERVAL" in '' | *[!0-9]* | 0) INTERVAL=12 ;; esac
          # All digits by now, but a leading zero would read as octal: 06 aborts
          # the step and 012 would silently mean 10 months.
          INTERVAL=$((10#$INTERVAL))
          month=$(date -u +%-m)
          if [ $(( (month - 1) % INTERVAL )) -eq 0 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: due
    if: needs.due.outputs.due == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync organizations from ROR
        env:
          ROR_CLIENT_ID: ${{ secrets.ROR_CLIENT_ID }}
        run: node packages/domain/scripts/sync-organizations.ts

      - name: Sync laboratories and OSUs from RNSR
        id: rnsr
        continue-on-error: true
        run: node packages/domain/scripts/sync-rnsr.ts

      - name: Format the generated files
        run: pnpm fmt:apply packages/domain/src/institutional-group/organization.ts packages/domain/src/institutional-group/laboratory.ts packages/domain/src/institutional-group/osu.ts

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          paths=(
            packages/domain/src/institutional-group/organization.ts
            packages/domain/src/institutional-group/laboratory.ts
            packages/domain/src/institutional-group/osu.ts
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "ROR and RNSR agree with the stored lists, nothing to propose."
            exit 0
          fi
          date=$(date -u +%F)
          branch="chore/sync-institutions-$date-$RUN_ID"
          title="chore(domain): sync institutions from ROR and RNSR ($date)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "$title" -- "${paths[@]}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" \
            --body "Organization names and acronyms refreshed from ROR. Laboratory and OSU names, requalified laboratory codes (the old code kept as a former code) and laboratory successors (the old laboratory kept, marked replaced) from RNSR. Nothing is ever removed. The diff is the whole proposal. A row ROR could not be reached for, or an entry absent from RNSR, is left untouched and named in the run log."

      # A PR opened with GITHUB_TOKEN does not trigger check.yml, so the sync
      # runs its own check.
      - name: Run the domain tests
        run: pnpm test --project @projet-igsn/domain

      - name: Fail the run when the RNSR sync failed
        if: steps.rnsr.outcome == 'failure'
        run: exit 1
