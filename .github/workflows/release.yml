name: "Release"

on:
  release:
    types: [published]

env:
  IMAGE_PREFIX: ghcr.io/otelo-osu/projet-igsn
  IMAGE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: production
      deployment: false

    permissions:
      contents: read
      packages: write

    outputs:
      domain: ${{ vars.DOMAIN }}
      oidc_issuer: ${{ vars.OIDC_ISSUER }}
      oidc_client_id: ${{ vars.OIDC_CLIENT_ID }}
      upload_limit: ${{ vars.UPLOAD_LIMIT }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check the values baked into the bundles
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
        run: |
          : "${DOMAIN:?set DOMAIN as a production environment variable}"
          : "${OIDC_ISSUER:?set OIDC_ISSUER as a production environment variable}"
          : "${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID as a production environment variable}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/api/Dockerfile
          target: prod
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/api:${{ env.IMAGE_TAG }}

      - name: Build and push the admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/admin/Dockerfile
          target: prod
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/admin:${{ env.IMAGE_TAG }}
          build-args: |
            VITE_API_URL=https://igsn.${{ vars.DOMAIN }}/api
            VITE_FRONTEND_URL=https://igsn.${{ vars.DOMAIN }}
            VITE_OIDC_AUTHORITY=${{ vars.OIDC_ISSUER }}
            VITE_OIDC_CLIENT_ID=${{ vars.OIDC_CLIENT_ID }}
            VITE_UPLOAD_LIMIT=${{ vars.UPLOAD_LIMIT }}
            VITE_SAMPLE_LOCK_POLL_SECONDS=${{ vars.SAMPLE_LOCK_POLL_SECONDS }}

      - name: Build and push the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ env.IMAGE_TAG }}
          build-args: |
            VITE_API_URL=https://igsn.${{ vars.DOMAIN }}/api
            VITE_ADMIN_URL=https://igsn.${{ vars.DOMAIN }}/admin
            VITE_OIDC_AUTHORITY=${{ vars.OIDC_ISSUER }}
            VITE_OIDC_CLIENT_ID=${{ vars.OIDC_CLIENT_ID }}

  deploy:
    runs-on: ubuntu-latest

    needs: build
    if: ${{ !github.event.release.prerelease }}
    environment: production

    concurrency:
      group: production
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Deploy
        env:
          GITHUB_VARS_JSON: ${{ toJSON(vars) }}
          GITHUB_SECRETS_JSON: ${{ toJSON(secrets) }}
          DOMAIN: ${{ needs.build.outputs.domain }}
          OIDC_ISSUER: ${{ needs.build.outputs.oidc_issuer }}
          OIDC_CLIENT_ID: ${{ needs.build.outputs.oidc_client_id }}
          UPLOAD_LIMIT: ${{ needs.build.outputs.upload_limit }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_URL: https://igsn.${{ needs.build.outputs.domain }}
        run: .github/scripts/deploy-release.sh
