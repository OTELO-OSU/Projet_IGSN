name: Mirror to GitLab PYTHEAS

on:
  push:
    branches:
      - main

    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  mirror:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PYTHEAS_GITLAB_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PYTHEAS_GITLAB_KNOWN_HOSTS }}

        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Configure GitLab remote
        run: |
          git remote remove pytheas 2>/dev/null || true

          git remote add pytheas \
            git@gitlab.osupytheas.fr:insu/Projet_IGSN.git

      - name: Mirror main
        if: github.ref == 'refs/heads/main'
        run: |
          git push --force-with-lease \
            pytheas \
            HEAD:refs/heads/main

      - name: Mirror tags
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git push pytheas \
            refs/tags/${GITHUB_REF_NAME}
