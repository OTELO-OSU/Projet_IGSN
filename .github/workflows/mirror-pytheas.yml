name: Mirror to GitLab PYTHEAS

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure GitLab remote
        run: |
          git remote remove pytheas 2>/dev/null || true

          git remote add pytheas \
            https://gitlab.osupytheas.fr/insu/Projet_IGSN.git

      - name: Test GitLab HTTPS access
        env:
          GITLAB_TOKEN: ${{ secrets.PYTHEAS_GITLAB_TOKEN }}
        run: |
          AUTH=$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)

          git \
            -c http.extraHeader="Authorization: Basic $AUTH" \
            ls-remote pytheas

      - name: Mirror main
        if: github.ref == 'refs/heads/main'
        env:
          GITLAB_TOKEN: ${{ secrets.PYTHEAS_GITLAB_TOKEN }}
        run: |
          AUTH=$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)

          git \
            -c http.extraHeader="Authorization: Basic $AUTH" \
            push --force \
            pytheas \
            HEAD:refs/heads/main

      - name: Mirror tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITLAB_TOKEN: ${{ secrets.PYTHEAS_GITLAB_TOKEN }}
        run: |
          AUTH=$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)

          git \
            -c http.extraHeader="Authorization: Basic $AUTH" \
            push \
            pytheas \
            refs/tags/${GITHUB_REF_NAME}
