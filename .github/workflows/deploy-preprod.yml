name: Deploy preprod

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push to the GitLab preprod branch
        env:
          GITLAB_TOKEN: ${{ secrets.PYTHEAS_GITLAB_TOKEN }}
        run: |
          AUTH=$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)

          git \
            -c http.extraHeader="Authorization: Basic $AUTH" \
            push --force \
            https://gitlab.osupytheas.fr/insu/Projet_IGSN.git \
            HEAD:refs/heads/preprod
