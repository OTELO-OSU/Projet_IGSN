name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # A manual run deploys preproduction only: production comes from a pushed tag alone.
    if: github.event_name == 'push' || github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_type == 'tag' && 'production' || 'preproduction' }}
    concurrency:
      group: ${{ github.ref_type == 'tag' && 'production' || 'preproduction' }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Name the images
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "IMAGE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=preprod-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          fi

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push the images
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
          UPLOAD_LIMIT: ${{ vars.UPLOAD_LIMIT }}
          SAMPLE_LOCK_POLL_SECONDS: ${{ vars.SAMPLE_LOCK_POLL_SECONDS }}
        run: |
          : "${DOMAIN:?set DOMAIN as a variable of this GitHub environment}"
          : "${OIDC_ISSUER:?set OIDC_ISSUER as a variable of this GitHub environment}"
          : "${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID as a variable of this GitHub environment}"
          docker build -f packages/api/Dockerfile --target prod -t "$IMAGE_PREFIX/api:$IMAGE_TAG" .
          docker build -f packages/admin/Dockerfile --target prod -t "$IMAGE_PREFIX/admin:$IMAGE_TAG" \
            --build-arg "VITE_API_URL=https://igsn.$DOMAIN/api" \
            --build-arg "VITE_FRONTEND_URL=https://igsn.$DOMAIN" \
            --build-arg "VITE_OIDC_AUTHORITY=$OIDC_ISSUER" \
            --build-arg "VITE_OIDC_CLIENT_ID=$OIDC_CLIENT_ID" \
            ${UPLOAD_LIMIT:+--build-arg VITE_UPLOAD_LIMIT=$UPLOAD_LIMIT} \
            ${SAMPLE_LOCK_POLL_SECONDS:+--build-arg VITE_SAMPLE_LOCK_POLL_SECONDS=$SAMPLE_LOCK_POLL_SECONDS} \
            .
          docker build -f packages/frontend/Dockerfile --target prod -t "$IMAGE_PREFIX/frontend:$IMAGE_TAG" \
            --build-arg "VITE_API_URL=https://igsn.$DOMAIN/api" \
            --build-arg "VITE_ADMIN_URL=https://igsn.$DOMAIN/admin" \
            --build-arg "VITE_FRONTEND_URL=https://igsn.$DOMAIN" \
            --build-arg "VITE_OIDC_AUTHORITY=$OIDC_ISSUER" \
            --build-arg "VITE_OIDC_CLIENT_ID=$OIDC_CLIENT_ID" \
            .
          docker build -t "$IMAGE_PREFIX/caddy:$IMAGE_TAG" infra/stack
          for image in api admin frontend caddy; do docker push "$IMAGE_PREFIX/$image:$IMAGE_TAG"; done

      - name: Deploy to Portainer
        env:
          VARS: ${{ toJSON(vars) }}
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          # Exporting every variable and secret keeps compose-env.ts the single variable list, since GitHub exposes none to the env unless named.
          eval "$(jq -r 'to_entries[] | "export \(.key)=\(.value | @sh)"' <<<"$VARS")"
          eval "$(jq -r 'to_entries[] | "export \(.key)=\(.value | @sh)"' <<<"$SECRETS")"
          infra/scripts/deploy-portainer.sh
