services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: postgres
    environment:
      POSTGRES_USER: igsn
      POSTGRES_PASSWORD: igsn
      POSTGRES_DB: igsn
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igsn -d igsn -h localhost"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-password}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_PASSWORD:-password}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  saml-idp:
    image: kenchan0130/simplesamlphp
    container_name: saml-idp
    ports:
      - "8081:8080"
    environment:
      SIMPLESAMLPHP_SP_ENTITY_ID: http://localhost:8080/realms/igsn
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: http://localhost:8080/realms/igsn/broker/satosa/endpoint
      SIMPLESAMLPHP_SP_SINGLE_LOGOUT_SERVICE: http://localhost:8080/realms/igsn/broker/satosa/endpoint
      SIMPLESAMLPHP_IDP_BASE_URL: http://localhost:8081/simplesaml/
      KEYCLOAK_PASSWORD: ${KEYCLOAK_PASSWORD:-password}
    volumes:
      - ./saml-idp/authsources.php:/var/www/simplesamlphp/config/authsources.php:ro

  maildev:
    image: maildev/maildev:2.2.1
    container_name: maildev
    ports:
      - "1080:1080"

  frontend:
    build:
      context: .
      dockerfile: ./packages/frontend/Dockerfile
      target: dev
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:3002
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/frontend/messages:/app/packages/frontend/messages
      - ./packages/domain/src:/app/packages/domain/src
      - ./packages/design-system/src:/app/packages/design-system/src
    develop:
      watch:
        - action: sync
          path: ./packages/frontend
          target: /app/packages/frontend
          ignore:
            - node_modules/
            - src/
            - messages/
        - action: sync
          path: ./packages/domain
          target: /app/packages/domain
          ignore:
            - node_modules/
            - src/
        - action: sync
          path: ./packages/design-system
          target: /app/packages/design-system
          ignore:
            - node_modules/
            - src/
        - action: sync+restart
          path: ./tsconfig.base.json
          target: /app/tsconfig.base.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  admin:
    build:
      context: .
      dockerfile: ./packages/admin/Dockerfile
      target: dev
    container_name: admin
    ports:
      - "3001:3001"
    environment:
      VITE_OIDC_AUTHORITY: ${OIDC_ISSUER:-http://localhost:8080/realms/igsn}
      VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-igsn-admin}
      VITE_SAMPLE_LOCK_POLL_SECONDS: "15"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - ./packages/admin/src:/app/packages/admin/src
      - ./packages/admin/messages:/app/packages/admin/messages
      - ./packages/domain/src:/app/packages/domain/src
      - ./packages/design-system/src:/app/packages/design-system/src
    develop:
      watch:
        - action: sync
          path: ./packages/admin
          target: /app/packages/admin
          ignore:
            - node_modules/
            - src/
            - messages/
        - action: sync
          path: ./packages/domain
          target: /app/packages/domain
          ignore:
            - node_modules/
            - src/
        - action: sync
          path: ./packages/design-system
          target: /app/packages/design-system
          ignore:
            - node_modules/
            - src/
        - action: sync+restart
          path: ./tsconfig.base.json
          target: /app/tsconfig.base.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  api:
    build:
      context: .
      dockerfile: ./packages/api/Dockerfile
      target: dev
    container_name: api
    ports:
      - "3002:3002"
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/igsn}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/realms/igsn/protocol/openid-connect/certs}
      OIDC_USERINFO_URI: ${OIDC_USERINFO_URI:-http://keycloak:8080/realms/igsn/protocol/openid-connect/userinfo}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-igsn-admin}
      OIDC_ALLOWED_IDENTITY_PROVIDERS: "${OIDC_ALLOWED_IDENTITY_PROVIDERS:-satosa,orcid}"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001"
      ADMIN_URL: "http://localhost:3001"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: igsn
      DATABASE_USER: igsn
      DATABASE_PASSWORD: igsn
      TRUST_PROXY_HEADERS: "true"
      ATTACHMENTS_DIR: /data/attachments
      SAMPLE_SEARCH_FUZZY_THRESHOLD: "0.8"
      UPLOAD_LIMIT: "5"
      SAMPLE_EDIT_LOCK_TTL_MINUTES: "15"
      SMTP_HOST: maildev
      SMTP_PORT: "1025"
      SMTP_FROM: postmaster@igsn.localhost
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/api/src:/app/packages/api/src:ro
      - ./packages/api/scripts:/app/packages/api/scripts:ro
      - ./packages/domain/src:/app/packages/domain/src:ro
      - attachments:/data/attachments
    develop:
      watch:
        - action: sync
          path: ./packages/api
          target: /app/packages/api
          ignore:
            - node_modules/
            - src/
            - scripts/
        - action: sync
          path: ./packages/domain
          target: /app/packages/domain
          ignore:
            - node_modules/
            - src/
        - action: sync+restart
          path: ./tsconfig.base.json
          target: /app/tsconfig.base.json
        - action: rebuild
          path: ./pnpm-lock.yaml

volumes:
  pgdata:
  attachments:
