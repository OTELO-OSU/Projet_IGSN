services:
  postgres:
    image: paradedb/paradedb:0.25.11-pg17
    container_name: postgres
    environment:
      POSTGRES_USER: igsn
      POSTGRES_PASSWORD: igsn
      POSTGRES_DB: igsn
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igsn -d igsn -h localhost"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - paradedb-data:/var/lib/postgresql/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-password}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_PASSWORD:-password}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  orcid-mock:
    image: quay.io/keycloak/keycloak:26.6
    container_name: orcid-mock
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-password}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_PASSWORD:-password}
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak/mock-orcid-realm.json:/opt/keycloak/data/import/mock-orcid-realm.json:ro

  saml-idp:
    image: kenchan0130/simplesamlphp
    container_name: saml-idp
    ports:
      - "8081:8080"
    environment:
      SIMPLESAMLPHP_SP_ENTITY_ID: http://localhost:8080/realms/igsn
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: http://localhost:8080/realms/igsn/broker/renater/endpoint
      SIMPLESAMLPHP_SP_SINGLE_LOGOUT_SERVICE: http://localhost:8080/realms/igsn/broker/renater/endpoint
      SIMPLESAMLPHP_IDP_BASE_URL: http://localhost:8081/simplesaml/
      KEYCLOAK_PASSWORD: ${KEYCLOAK_PASSWORD:-password}
    volumes:
      - ./saml-idp/authsources.php:/var/www/simplesamlphp/config/authsources.php:ro

  maildev:
    image: maildev/maildev:2.2.1
    container_name: maildev
    ports:
      - "1080:1080"

  datacite:
    image: caddy:2-alpine
    container_name: datacite
    volumes:
      - ./datacite-mock/Caddyfile:/etc/caddy/Caddyfile:ro

  webhook-sink:
    image: node:24-alpine
    container_name: webhook-sink
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./webhook-sink/server.mjs:/app/server.mjs:ro

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "3000:8080"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./packages/frontend/Dockerfile
      target: dev
    container_name: frontend
    environment:
      API_URL: http://api:3002
      VITE_API_URL: http://localhost:3000/api
      VITE_OIDC_AUTHORITY: ${OIDC_ISSUER:-http://localhost:8080/realms/igsn}
      VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-igsn-admin}
      VITE_ADMIN_URL: http://localhost:3000/admin
      VITE_FRONTEND_URL: http://localhost:3000
      VITE_SEARCH_CSV_EXPORT_LIMIT: "10"
      VITE_SEARCH_XLSX_EXPORT_LIMIT: "5"
      VITE_DATA_GOUV_DATASET_URL: https://demo.data.gouv.fr/datasets/igsn-preprod
      VITE_DEMO_BANNER: ${DEMO_BANNER:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/frontend/messages:/app/packages/frontend/messages
      - ./packages/domain/src:/app/packages/domain/src
      - ./packages/design-system/src:/app/packages/design-system/src
    develop:
      watch:
        - action: sync
          path: ./packages/frontend
          target: /app/packages/frontend
          ignore:
            - node_modules/
            - src/
            - messages/
        - action: sync
          path: ./packages/domain
          target: /app/packages/domain
          ignore:
            - node_modules/
            - src/
        - action: sync
          path: ./packages/design-system
          target: /app/packages/design-system
          ignore:
            - node_modules/
            - src/
        - action: sync+restart
          path: ./tsconfig.base.json
          target: /app/tsconfig.base.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  admin:
    build:
      context: .
      dockerfile: ./packages/admin/Dockerfile
      target: dev
    container_name: admin
    environment:
      VITE_OIDC_AUTHORITY: ${OIDC_ISSUER:-http://localhost:8080/realms/igsn}
      VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-igsn-admin}
      VITE_OIDC_ORCID_IDENTITY_PROVIDER: ${OIDC_ORCID_IDENTITY_PROVIDER:-orcid}
      VITE_SAMPLE_LOCK_POLL_SECONDS: "15"
      VITE_DEMO_BANNER: ${DEMO_BANNER:-}
      VITE_API_URL: http://localhost:3000/api
      VITE_FRONTEND_URL: http://localhost:3000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/admin/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - ./packages/admin/src:/app/packages/admin/src
      - ./packages/admin/messages:/app/packages/admin/messages
      - ./packages/domain/src:/app/packages/domain/src
      - ./packages/design-system/src:/app/packages/design-system/src
    develop:
      watch:
        - action: sync
          path: ./packages/admin
          target: /app/packages/admin
          ignore:
            - node_modules/
            - src/
            - messages/
        - action: sync
          path: ./packages/domain
          target: /app/packages/domain
          ignore:
            - node_modules/
            - src/
        - action: sync
          path: ./packages/design-system
          target: /app/packages/design-system
          ignore:
            - node_modules/
            - src/
        - action: sync+restart
          path: ./tsconfig.base.json
          target: /app/tsconfig.base.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  api:
    build:
      context: .
      dockerfile: ./packages/api/Dockerfile
      target: dev
    container_name: api
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/igsn}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/realms/igsn/protocol/openid-connect/certs}
      OIDC_USERINFO_URI: ${OIDC_USERINFO_URI:-http://keycloak:8080/realms/igsn/protocol/openid-connect/userinfo}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-igsn-admin}
      OIDC_ALLOWED_IDENTITY_PROVIDERS: "${OIDC_ALLOWED_IDENTITY_PROVIDERS:-renater,orcid}"
      OIDC_ORCID_IDENTITY_PROVIDER: "${OIDC_ORCID_IDENTITY_PROVIDER:-orcid}"
      ORCID_LINK_CLIENT_ID: ${ORCID_LINK_CLIENT_ID:-igsn-broker}
      ORCID_LINK_CLIENT_SECRET: ${ORCID_LINK_CLIENT_SECRET:-mock-orcid-secret}
      ORCID_LINK_AUTHORIZATION_URL: ${ORCID_LINK_AUTHORIZATION_URL:-http://localhost:8180/realms/mock-orcid/protocol/openid-connect/auth}
      ORCID_LINK_TOKEN_URL: ${ORCID_LINK_TOKEN_URL:-http://orcid-mock:8180/realms/mock-orcid/protocol/openid-connect/token}
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      ADMIN_URL: "http://localhost:3000/admin"
      FRONTEND_URL: "http://localhost:3000"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: igsn
      DATABASE_USER: igsn
      DATABASE_PASSWORD: igsn
      TRUST_PROXY_HEADERS: "true"
      ATTACHMENTS_DIR: /data/attachments
      SAMPLE_SEARCH_FUZZY_THRESHOLD: "0.8"
      UPLOAD_LIMIT: "5"
      SAMPLE_EDIT_LOCK_TTL_MINUTES: "15"
      EMBARGO_RELEASE_CRON: "* * * * *"
      SMTP_HOST: maildev
      SMTP_PORT: "1025"
      SMTP_FROM: postmaster@igsn.localhost
      CONTACT_EMAIL: contact@igsn.localhost
      CAPTCHA_HMAC_SECRET: dev-captcha-hmac-secret-not-for-production
      CAPTCHA_COST: "1000"
      DATACITE_API_HOST: ${DATACITE_API_HOST:-http://datacite:8080}
      DATACITE_API_KEY: ${DATACITE_API_KEY:-dev}
      DATACITE_DOI_PREFIX: ${DATACITE_DOI_PREFIX:-10.70113}
      WEBHOOK_DEV_HOSTS: webhook-sink
      SEARCH_CSV_EXPORT_LIMIT: "10"
      SEARCH_XLSX_EXPORT_LIMIT: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      datacite:
        condition: service_started
    volumes:
      - ./packages/api/src:/app/packages/api/src:ro
      - ./packages/api/scripts:/app/packages/api/scripts:ro
      - ./packages/api/migrations:/app/packages/api/migrations:ro
      - ./packages/domain/src:/app/packages/domain/src:ro
      - attachments:/data/attachments
    develop:
      watch:
        - action: sync
          path: ./packages/api
          target: /app/packages/api
          ignore:
            - node_modules/
            - src/
            - scripts/
            - migrations/
        - action: sync
          path: ./packages/domain
          target: /app/packages/domain
          ignore:
            - node_modules/
            - src/
        - action: sync+restart
          path: ./tsconfig.base.json
          target: /app/tsconfig.base.json
        - action: rebuild
          path: ./pnpm-lock.yaml

  data-gouv-export:
    build:
      context: .
      dockerfile: ./packages/api/Dockerfile
      target: dev
    command: ["node", "src/data-gouv/main.ts"]
    restart: on-failure
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: igsn
      DATABASE_USER: igsn
      DATABASE_PASSWORD: igsn
      FRONTEND_URL: "http://localhost:3000"
      DATA_GOUV_URL: ${DATA_GOUV_URL:-}
      DATA_GOUV_DATASET_ID: ${DATA_GOUV_DATASET_ID:-}
      DATA_GOUV_TOKEN: ${DATA_GOUV_TOKEN:-}
      DATA_GOUV_CRON: "${DATA_GOUV_CRON:-0 3 1 * *}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/api/src:/app/packages/api/src:ro
      - ./packages/api/scripts:/app/packages/api/scripts:ro
      - ./packages/domain/src:/app/packages/domain/src:ro

volumes:
  paradedb-data:
  attachments:
