x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME} -h localhost",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: igsn-api:preprod
    command: ["node", "scripts/migrate.ts"]
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: igsn-api:preprod
    restart: unless-stopped
    environment:
      PORT: "8080"
      CORS_ORIGINS: "https://igsn-admin.${DOMAIN},https://igsn.${DOMAIN}"
      ADMIN_URL: "https://igsn-admin.${DOMAIN}"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      OIDC_ISSUER: "https://sso-test.earth-data.fr/realms/gaia-data"
      OIDC_CLIENT_ID: "formaterre-igsn"
      OIDC_ALLOWED_IDENTITY_PROVIDERS: "${OIDC_ALLOWED_IDENTITY_PROVIDERS:-satosa,orcid}"
      TRUST_PROXY_HEADERS: "true"
      ATTACHMENTS_DIR: /data/attachments
      SAMPLE_SEARCH_FUZZY_THRESHOLD: "${SAMPLE_SEARCH_FUZZY_THRESHOLD:-0.8}"
      UPLOAD_LIMIT: "${UPLOAD_LIMIT:-5}"
      SAMPLE_EDIT_LOCK_TTL_MINUTES: "${SAMPLE_EDIT_LOCK_TTL_MINUTES:-15}"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: "postmaster@igsn.${DOMAIN}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME}"
      SMTP_FROM_NAME_ADMIN: "${SMTP_FROM_NAME_ADMIN}"
    healthcheck: *healthcheck
    volumes:
      - attachments:/data/attachments
    depends_on:
      migrate:
        condition: service_completed_successfully

  # ponytail: H2 in-memory, so brokered users vanish on container recreate and
  # re-provision on next login. Switch to `start` + Postgres if durable state matters.
  # Unused by the apps while GaiaData is the SSO: kept as the rollback path, to
  # remove with saml-idp once GaiaData login is proven.
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_HOSTNAME: "https://igsn-auth.${DOMAIN}"
      KC_PROXY_HEADERS: xforwarded
      ADMIN_REDIRECT_URI: "https://igsn-admin.${DOMAIN}/*"
      ADMIN_WEB_ORIGIN: "https://igsn-admin.${DOMAIN}"
      SHIBBOLETH_SSO_URL: "https://igsn-idp.${DOMAIN}/simplesaml/saml2/idp/SSOService.php"
      SHIBBOLETH_SLO_URL: "https://igsn-idp.${DOMAIN}/simplesaml/saml2/idp/SingleLogoutService.php"
      ORCID_LOGOUT_URL: "https://igsn-auth.${DOMAIN}/realms/mock-orcid/protocol/openid-connect/logout"
      ORCID_BROKER_REDIRECT_URI: "https://igsn-auth.${DOMAIN}/realms/igsn/broker/orcid/endpoint"
      ORCID_AUTHORIZATION_URL: "https://igsn-auth.${DOMAIN}/realms/mock-orcid/protocol/openid-connect/auth"
      ORCID_TOKEN_URL: "http://localhost:8080/realms/mock-orcid/protocol/openid-connect/token"
      ORCID_USERINFO_URL: "http://localhost:8080/realms/mock-orcid/protocol/openid-connect/userinfo"
      ORCID_ISSUER: "https://igsn-auth.${DOMAIN}/realms/mock-orcid"
      ORCID_JWKS_URL: "http://localhost:8080/realms/mock-orcid/protocol/openid-connect/certs"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  saml-idp:
    image: kenchan0130/simplesamlphp
    restart: unless-stopped
    environment:
      SIMPLESAMLPHP_SP_ENTITY_ID: "https://igsn-auth.${DOMAIN}/realms/igsn"
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: "https://igsn-auth.${DOMAIN}/realms/igsn/broker/satosa/endpoint"
      SIMPLESAMLPHP_SP_SINGLE_LOGOUT_SERVICE: "https://igsn-auth.${DOMAIN}/realms/igsn/broker/satosa/endpoint"
      SIMPLESAMLPHP_IDP_BASE_URL: "https://igsn-idp.${DOMAIN}/simplesaml/"
      KEYCLOAK_PASSWORD: ${KEYCLOAK_PASSWORD}
    volumes:
      - ./saml-idp/authsources.php:/var/www/simplesamlphp/config/authsources.php:ro
      - ./saml-idp/apache-hardening.conf:/etc/apache2/conf-enabled/zzz-hardening.conf:ro

  admin:
    image: igsn-admin:preprod
    restart: unless-stopped
    healthcheck: *healthcheck

  frontend:
    image: igsn-frontend:preprod
    restart: unless-stopped
    environment:
      PORT: "8080"
      API_URL: http://api:8080
    healthcheck: *healthcheck

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
      frontend:
        condition: service_healthy
      keycloak:
        condition: service_started
      saml-idp:
        condition: service_started

volumes:
  pgdata:
  attachments:
  caddy_data:
  caddy_config:
