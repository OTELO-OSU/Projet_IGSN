x-database: &database
  DATABASE_HOST: ${DATABASE_HOST}
  DATABASE_PORT: ${DATABASE_PORT:-5432}
  DATABASE_NAME: ${DATABASE_NAME}
  DATABASE_USER: ${DATABASE_USER}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD}
  DATABASE_SSL: ${DATABASE_SSL:-verify-full}
  NODE_EXTRA_CA_CERTS: ${DATABASE_CA_FILE:-}

x-healthcheck: &healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8080/"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  migrate:
    image: ghcr.io/otelo-osu/projet-igsn/api:${IMAGE_TAG:?IMAGE_TAG is required}
    command: ["node", "scripts/migrate.ts"]
    environment: *database
    volumes:
      - ./ca:/ca:ro
    restart: "no"

  api:
    image: ghcr.io/otelo-osu/projet-igsn/api:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      <<: *database
      PORT: "8080"
      CORS_ORIGINS: "https://igsn.${DOMAIN}"
      ADMIN_URL: "https://igsn.${DOMAIN}/admin"
      FRONTEND_URL: "https://igsn.${DOMAIN}"
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_ALLOWED_IDENTITY_PROVIDERS: "${OIDC_ALLOWED_IDENTITY_PROVIDERS:-satosa,orcid}"
      TRUST_PROXY_HEADERS: "true"
      ATTACHMENTS_DIR: /data/attachments
      SAMPLE_SEARCH_FUZZY_THRESHOLD: "${SAMPLE_SEARCH_FUZZY_THRESHOLD:-0.8}"
      UPLOAD_LIMIT: "${UPLOAD_LIMIT:-5}"
      SAMPLE_EDIT_LOCK_TTL_MINUTES: "${SAMPLE_EDIT_LOCK_TTL_MINUTES:-15}"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: "${SMTP_FROM:-postmaster@igsn.${DOMAIN}}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME}"
      SMTP_FROM_NAME_ADMIN: "${SMTP_FROM_NAME_ADMIN}"
      DATACITE_API_HOST: "${DATACITE_API_HOST}"
      DATACITE_API_KEY: "${DATACITE_API_KEY}"
      DATACITE_DOI_PREFIX: "${DATACITE_DOI_PREFIX}"
    healthcheck: *healthcheck
    volumes:
      - attachments:/data/attachments
      - ./ca:/ca:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin:
    image: ghcr.io/otelo-osu/projet-igsn/admin:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/admin/"]

  frontend:
    image: ghcr.io/otelo-osu/projet-igsn/frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      PORT: "8080"
      API_URL: http://api:8080
    healthcheck: *healthcheck

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  attachments:
  caddy_data:
  caddy_config:
